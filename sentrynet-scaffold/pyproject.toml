[project]
name = "sentrynet"
version = "0.1.0"
description = "AI-augmented network traffic monitoring & SOC assistant"
authors = [{ name = "Omer Gafar" }]
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "streamlit>=1.30",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
